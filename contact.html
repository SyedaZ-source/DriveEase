
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | DriveEase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">DriveEase</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="cars.html">Available Cars</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
            <a href="faqs.html">FAQs</a>
        </nav>
    </header>

    <section class="page-banner">
        <h1>Contact Us</h1>
        <p>Have a question? Send us a message.</p>
    </section>

    <main class="page-content">
        <div class="contact-info">
            <h2>Get in Touch</h2>
            <p>Email: support@driveease.com</p>
            <p>Phone: 0300-1234567</p>
            <p>We are here to help with your car rental questions.</p>
        </div>

        <form id="contact-form" class="booking-form">

            <label for="contact-name">Your Name</label>
            <input type="text" id="contact-name"
                placeholder="Enter your name" required>

            <label for="contact-email">Email Address</label>
            <input type="email" id="contact-email"
                placeholder="Enter your email" required>

            <label for="contact-message">Your Message</label>
            <textarea id="contact-message"
                placeholder="Write your message"
                rows="5" required></textarea>

            <button type="submit" class="btn">Send Message</button>

            <p id="contact-response"></p>
        </form>
    </main>

    <footer>
        <p>© 2026 DriveEase Car Rental</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
